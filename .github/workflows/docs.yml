# Builds the VitePress wiki in docs/ and publishes it to GitHub Pages.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
name: Docs

# Pushes to the docs branch rebuild and redeploy the wiki. The docs branch is the repository variable
# DOCS_BRANCH (Settings > Secrets and variables > Actions > Variables), or the default branch when it is
# not set, so moving the wiki to a new version branch needs no change to this file. That branch must also
# be allowed under Settings > Environments > github-pages > Deployment branches.
# A manual run deploys whatever branch it is started from.
on:
  push:
    paths:
      - 'docs/**'
      - 'common/src/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == (vars.DOCS_BRANCH || github.event.repository.default_branch)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci

      # Runs the data sync first. Served from the root of a custom (sub)domain, so no /Resources-Trees/ prefix.
      # Remove DOCS_BASE to go back to https://<user>.github.io/Resources-Trees/.
      - run: npm run build
        env:
          DOCS_BASE: /

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
